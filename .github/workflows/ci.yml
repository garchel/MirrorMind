name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  # Unifica push e pull request da mesma branch numa única entrada: o evento
  # mais novo cancela o anterior em vez de duplicar execuções.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows required
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        # Lê versão/componentes do rust-toolchain.toml (fonte única de verdade).
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-all-crates: "true"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm run test:ci:frontend 2>&1 | Tee-Object -FilePath test-results/frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend build
        run: npm run build

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm run test:ci:rust 2>&1 | Tee-Object -FilePath test-results/rust.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build Windows E2E app
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm run build:e2e:windows 2>&1 | Tee-Object -FilePath test-results/windows-e2e-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Desktop E2E
        shell: powershell
        run: |
          npm run test:e2e:windows 2>&1 | Tee-Object -FilePath test-results/windows-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows distributable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm run build:desktop:bundle 2>&1 | Tee-Object -FilePath test-results/windows-bundle-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test Windows distributable
        shell: powershell
        run: |
          ./scripts/verify-windows-bundle.ps1 `
            -TargetDirectory src-tauri/target/release `
            -ManifestPath test-results/windows-bundle-manifest.json `
            2>&1 | Tee-Object -FilePath test-results/windows-bundle-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirrormind-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            test-results/windows-bundle-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-windows
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        # Lê versão/componentes do rust-toolchain.toml (fonte única de verdade).
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-all-crates: "true"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:ci:frontend 2>&1 | tee test-results/frontend.log

      - name: Frontend build
        run: npm run build

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:ci:rust 2>&1 | tee test-results/rust.log

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-ubuntu
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  linux-e2e-smoke:
    name: Linux E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        # Lê versão/componentes do rust-toolchain.toml (fonte única de verdade).
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-all-crates: "true"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux E2E app
        run: |
          mkdir -p test-results
          npm run build:e2e:linux 2>&1 | tee test-results/linux-e2e-build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Desktop E2E smoke (display virtual)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            npm run test:e2e:linux 2>&1 | tee test-results/linux-e2e.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-linux-e2e
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        # Lê versão/componentes do rust-toolchain.toml (fonte única de verdade;
        # llvm-tools-preview já está declarado no arquivo para a cobertura).
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Frontend coverage
        id: frontend_coverage
        run: npm run test:coverage:frontend

      - name: Rust coverage summary
        id: rust_coverage
        if: ${{ always() }}
        run: npm run test:coverage:rust

      - name: Export Rust LCOV report
        id: rust_export
        if: ${{ always() && steps.rust_coverage.outcome == 'success' }}
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov report \
            --manifest-path src-tauri/Cargo.toml \
            --lcov \
            --output-path coverage/rust/lcov.info

      - name: Verify coverage reports
        if: ${{ always() }}
        run: |
          missing=0
          for report in \
            coverage/frontend/coverage-summary.json \
            coverage/frontend/lcov.info \
            coverage/rust/lcov.info
          do
            if [ ! -s "$report" ]; then
              echo "Missing coverage report: $report"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ubuntu
          path: coverage
          if-no-files-found: error
          retention-days: 14
